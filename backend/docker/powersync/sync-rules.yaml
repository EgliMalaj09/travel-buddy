# Sync Streams: which rows each phone receives. Filled in feature by feature.
# Rule: each user gets only their own rows (Part 2 adds the shared trips they are a member of).
# A soft-deleted row stops matching, so PowerSync removes it from the phone.
config:
  edition: 3

streams:
  # Create a trip (KAN-19): the user's trips, their stops and their flights.
  my_trips:
    auto_subscribe: true
    query: select * from trips where owner_id = auth.user_id() and deleted_at is null
  my_trip_stops:
    auto_subscribe: true
    query: select * from trip_stops where deleted_at is null and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  my_flights:
    auto_subscribe: true
    query: select * from flights where deleted_at is null and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  # Places (KAN-35): the places of the user's trips, and their own bucket list (no trip).
  # Part 2 (shared trips): personal places of other members are left out.
  my_places:
    auto_subscribe: true
    query: select * from places where deleted_at is null and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  my_bucket_list:
    auto_subscribe: true
    query: select * from places where deleted_at is null and trip_id is null and created_by_user_id = auth.user_id()
  # Smart checklist (KAN-24/25): the checklist items of the user's trips.
  # Deleted auto items are sent too (with deleted_at set), so the phone knows not to make them again
  # ("a deleted auto item stays deleted"). The phone shows only rows where deleted_at is null.
  my_checklist_items:
    auto_subscribe: true
    query: select * from checklist_items where (deleted_at is null or source = 'auto') and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  # Expenses (KAN-42/43): the expenses of the user's trips. Personal expenses of other people are left out (D7, Part 2).
  # Exchange rates are not synced: the app asks GET /fx/rates and keeps final days on the phone.
  my_expenses:
    auto_subscribe: true
    query: select * from expenses where deleted_at is null and (scope = 'shared' or owner_user_id = auth.user_id()) and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  # Photos and notes (KAN-39/40): the photo records of the user's trips. The image files are not synced: the
  # phone uploads and downloads them through /media/{id}/file and /thumbnail.
  my_media:
    auto_subscribe: true
    query: select * from media where deleted_at is null and purpose = 'trip_photo' and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  # Settings (KAN-21/22): the user's one settings row (its id is the user id). Same switches and units on every phone.
  my_settings:
    auto_subscribe: true
    query: select * from user_settings where id = auth.user_id()

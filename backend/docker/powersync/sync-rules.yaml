# Sync Streams: which rows each phone receives. Filled in feature by feature.
# Rule: each user gets only their own rows (Part 2 adds the shared trips they are a member of).
# A soft-deleted row stops matching, so PowerSync removes it from the phone.
config:
  edition: 3

streams:
  # Create a trip (KAN-19): the user's trips, their stops and their flights.
  my_trips:
    auto_subscribe: true
    query: select * from trips where owner_id = auth.user_id() and deleted_at is null
  my_trip_stops:
    auto_subscribe: true
    query: select * from trip_stops where deleted_at is null and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  my_flights:
    auto_subscribe: true
    query: select * from flights where deleted_at is null and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)
  # Smart checklist (KAN-24/25): the checklist items of the user's trips.
  # Deleted auto items are sent too (with deleted_at set), so the phone knows not to make them again
  # ("a deleted auto item stays deleted"). The phone shows only rows where deleted_at is null.
  my_checklist_items:
    auto_subscribe: true
    query: select * from checklist_items where (deleted_at is null or source = 'auto') and trip_id in (select id from trips where owner_id = auth.user_id() and deleted_at is null)

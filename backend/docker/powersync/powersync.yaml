# PowerSync Open Edition, local development only (free). See backend/README.md.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

# PowerSync keeps its own data in a separate PostgreSQL database.
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: 8080

sync_config:
  path: sync-rules.yaml

# The phone gives PowerSync its normal access token from our API (ES256, audience "travel-app-powersync").
# PowerSync checks it with the API's public key at /.well-known/jwks.json (KAN-16, A1). The API runs on the
# laptop with `dotnet run`, so PowerSync (inside Docker) reaches it at host.docker.internal.
# block_local_jwks is off only because that address is local; beta and production use a public https address.
client_auth:
  audience: ['travel-app-powersync']
  jwks_uri: !env PS_JWKS_URI
  block_local_jwks: false

telemetry:
  disable_telemetry_sharing: true

name: Deploy beta

# Puts a new version of the API and/or the back office on the beta server (KAN-61).
# Runs ONLY when started by hand: GitHub > Actions > Deploy beta > Run workflow. Never on push.
# One-time setup (Azure login without a stored password, GitHub variables and secrets): docs/COMMANDS.md,
# "Beta server (KAN-61)". No secret is written in this file.
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to deploy (image = only build and store the API image, for the first setup)
        type: choice
        options: [both, api, backoffice, image]
        default: both

concurrency:
  group: deploy-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-image:
    if: inputs.what != 'backoffice'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        # Image names must be lower case.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/travel-app-api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image (private package)
        run: |
          echo "Image: ${{ steps.name.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          docker build -t "${{ steps.name.outputs.image }}" backend
          docker push "${{ steps.name.outputs.image }}"

  api-deploy:
    needs: api-image
    if: inputs.what == 'api' || inputs.what == 'both'
    runs-on: ubuntu-latest
    environment: beta
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup is done
        run: |
          for v in "${{ vars.AZURE_CLIENT_ID }}" "${{ vars.AZURE_TENANT_ID }}" "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
                   "${{ vars.AZURE_RESOURCE_GROUP }}" "${{ vars.AZURE_API_APP }}" "${{ vars.BETA_API_URL }}"; do
            if [ -z "$v" ]; then echo "A beta variable is missing: see docs/COMMANDS.md, Beta server, step 6"; exit 1; fi
          done
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Switch the API to the new image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_API_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.api-image.outputs.image }}" \
            --output none
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.BETA_API_URL }}/health" > /dev/null; then echo "API is up"; exit 0; fi
            sleep 10
          done
          echo "API did not answer /health within 5 minutes"; exit 1

  backoffice:
    if: inputs.what == 'backoffice' || inputs.what == 'both'
    runs-on: ubuntu-latest
    environment: beta
    defaults:
      run:
        working-directory: backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backoffice/package-lock.json
      - name: Setup is done
        run: |
          if [ -z "${{ vars.BETA_API_URL }}" ]; then echo "BETA_API_URL is missing: see docs/COMMANDS.md, Beta server"; exit 1; fi
      - run: npm ci
      - name: Build (points at the beta API)
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.BETA_API_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: backoffice/dist
          skip_app_build: true
          skip_api_build: true

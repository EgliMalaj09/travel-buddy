name: Frontend

on:
  push:
    paths: ['frontend/**', 'legal/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'legal/**', '.github/workflows/frontend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Legal texts in the app match legal/*.md (run npm run legal:texts after editing them)
        run: npm run legal:texts && git diff --exit-code -- src/data/static/legalTexts.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci

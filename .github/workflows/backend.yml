name: Backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore
      # The OpenAPI file is written on build; it must already be committed and up to date.
      - name: OpenAPI file is up to date
        run: git diff --exit-code -- openapi/
      # Tests use a real PostgreSQL through Testcontainers (Docker is available on GitHub runners).
      - run: dotnet test --no-build

  # The beta server runs the API as a container image (KAN-61). Build it on every change so a broken
  # Dockerfile shows up here, not on deploy day. Nothing is pushed.
  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (not pushed)
        run: docker build -t travel-app-api:check backend
